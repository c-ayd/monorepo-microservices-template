name: Pull Requests against Main

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.detect.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only origin/main HEAD)
          CHANGED_SERVICES=$(echo "$CHANGED_FILES" | \
            grep '^src/' | \
            awk -F'/' '{print $2}' | \
            sort -u | \
            grep -v '^$') || true

          if [ -z "$CHANGED_SERVICES" ]; then
            echo "services=[]" >> $GITHUB_OUTPUT
          else
            echo "services=$(echo "$CHANGED_SERVICES" | jq -R . | jq -cs '.')" >> $GITHUB_OUTPUT
          fi

  build-and-run-tests:
    name: Build & Run Tests
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.services != '[]'
    strategy:
      matrix:
        service: ${{ fromJSON(needs.detect-changes.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: 'src/${{ matrix.service }}/**/packages.lock.json'

      - name: Build and run tests
        run: |
          SOLUTION_FILE="${{ github.workspace }}/src/${{ matrix.service }}/${{ matrix.service }}Solution.slnx"
          if [ ! -f "$SOLUTION_FILE" ]; then
            echo "$SOLUTION_FILE could not be found"
            exit 1
          fi
          
          dotnet restore "$SOLUTION_FILE"
          dotnet build --no-restore "$SOLUTION_FILE"
          dotnet test --no-build "$SOLUTION_FILE"
